name: ammar_fe_flutter
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: 5.1.2
  device_preview: ^1.2.0
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  flutter_gen: ^5.13.0+1
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.1.0
  hooks_riverpod: ^3.1.0
  loading_animation_widget: ^1.3.0
  modal_bottom_sheet: 3.0.0
  package_info_plus: ^8.3.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_html: ^3.0.0
  fl_chart: ^1.2.0
  webview_flutter: ^4.14.1
  timelines_plus: 2.0.0
  flutter_client_sse: ^2.0.3
  syncfusion_flutter_pdfviewer: ^33.2.13
  open_filex: ^4.7.0

dev_dependencies:
  build_runner: ^2.13.0
  change_app_package_name: 1.5.0
  flutter_gen_runner: ^5.13.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/

    - assets/icons/
    - assets/icons/2.0x/
    - assets/icons/3.0x/

  fonts:
    - family: Kiro
      fonts:
        - asset: assets/fonts/kiro_thin.otf
          weight: 100
        - asset: assets/fonts/kiro_thin_italic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/kiro_extralight.otf
          weight: 200
        - asset: assets/fonts/kiro_extralight_italic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/kiro_light.otf
          weight: 300
        - asset: assets/fonts/kiro_light_italic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/kiro.otf
          weight: 400
        - asset: assets/fonts/kiro_italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/kiro_bold.otf
          weight: 700
        - asset: assets/fonts/kiro_bold_italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/kiro_extrabold.otf
          weight: 800
        - asset: assets/fonts/kiro_extrabold_italic.otf
          weight: 800
          style: italic

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_logo_dapurself.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/ic_logo_dapurself.png
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    image: assets/images/ic_logo_dapurself.png
